name: Windows qualification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-qualification.yml
      - cmd/**
      - internal/**
      - schemas/**
      - plugins/**
      - scripts/qualify-claude-windows.ps1
      - scripts/qualify-codex-windows.ps1
      - toolkit/**
      - toolkit.json
      - .claude-plugin/**
      - go.mod
      - go.sum
  pull_request:
    paths:
      - .github/workflows/windows-qualification.yml
      - cmd/**
      - internal/**
      - schemas/**
      - plugins/**
      - scripts/qualify-claude-windows.ps1
      - scripts/qualify-codex-windows.ps1
      - toolkit/**
      - toolkit.json
      - .claude-plugin/**
      - go.mod
      - go.sum
  workflow_dispatch:

concurrency:
  group: windows-qualification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: off
  CGO_ENABLED: 0
  AI4J_CLAUDE_VERSION: 2.1.211
  AI4J_CODEX_VERSION: 0.149.1

jobs:
  claude:
    name: Claude lifecycle on Windows AMD64
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the real commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: false

      - name: Install the supported Claude Code version
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:AI4J_CLAUDE_VERSION
          $ClaudeBin = Join-Path $env:USERPROFILE '.local\bin'
          $ClaudeConfig = Join-Path $env:USERPROFILE '.claude-ai4j-qualification'
          New-Item -ItemType Directory -Force -Path $ClaudeConfig | Out-Null
          $ClaudeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CLAUDE_CONFIG_DIR=$ClaudeConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'DISABLE_UPDATES=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $ClaudeBin 'claude.exe') --version

      - name: Run the live Claude lifecycle
        shell: pwsh
        env:
          AI4J_QUALIFICATION_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AI4J_QUALIFICATION_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AI4J_QUALIFICATION_EVIDENCE: ${{ runner.temp }}\ai4j-claude-windows-evidence
          AI4J_QUALIFICATION_GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/qualify-claude-windows.ps1

      - name: Retain Claude qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-windows-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}\ai4j-claude-windows-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm qualification did not modify tracked files
        if: always()
        run: git diff --exit-code -- .

  codex:
    name: Codex package on Windows AMD64
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out the real commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: false

      - name: Install Codex and the declared package runtime
        shell: pwsh
        run: |
          npm install --global --no-audit --no-fund "@openai/codex@$env:AI4J_CODEX_VERSION"
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:AI4J_CLAUDE_VERSION
          $ClaudeBin = Join-Path $env:USERPROFILE '.local\bin'
          $ClaudeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $ClaudeBin 'claude.exe') --version

      - name: Qualify the Codex package and native handoff
        shell: pwsh
        env:
          AI4J_QUALIFICATION_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AI4J_QUALIFICATION_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AI4J_QUALIFICATION_EVIDENCE: ${{ runner.temp }}\ai4j-codex-windows-evidence
          AI4J_QUALIFICATION_GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/qualify-codex-windows.ps1

      - name: Retain Codex qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-windows-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}\ai4j-codex-windows-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm qualification did not modify tracked files
        if: always()
        run: git diff --exit-code -- .
